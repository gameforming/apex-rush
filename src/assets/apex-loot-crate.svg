<svg xmlns="http://www.w3.org/2000/svg" width="520" height="440" viewBox="0 0 520 440" fill="none">
  <defs>
    <linearGradient id="front" x1="104" y1="118" x2="270" y2="376" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF9858"/><stop offset=".42" stop-color="#D94D2D"/><stop offset="1" stop-color="#67251F"/>
    </linearGradient>
    <linearGradient id="side" x1="268" y1="150" x2="426" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A43C2B"/><stop offset="1" stop-color="#361B20"/>
